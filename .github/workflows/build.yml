name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Descomprimiendo $f..."
              unzip -o "$f"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          # Busca la carpeta exacta del proyecto y entra en ella
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          echo "Construyendo en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PornBlocker-APK
          path: '**/app-debug.apk'
